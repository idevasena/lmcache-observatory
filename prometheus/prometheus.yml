global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    host: gost-test84

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: lmcache-mp
    static_configs:
      - targets: ["localhost:8080"]     # HTTP frontend, not 9095
  - job_name: vllm
    static_configs:
      - targets: ["localhost:8001"]
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]
  - job_name: dcgm
    static_configs:
      - targets: ["localhost:9400"]
